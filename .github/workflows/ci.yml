name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Python suite
        if: matrix.suite == 'python'
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pytest -q
      - name: Web suite
        if: matrix.suite == 'web'
        working-directory: web
        run: |
          npm ci
          npm run build
          npx vitest run
